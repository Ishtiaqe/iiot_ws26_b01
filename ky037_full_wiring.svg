<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030">
<rect width="1400" height="1030" fill="#f6f8fc"/><style>text{font-family:Arial,sans-serif;fill:#1b263b}.title{font-size:32px;font-weight:700}.head{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.pin{font-size:17px;font-weight:700}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="40" y="53" class="title">ESP32 + OLED + KY-037: 5 V microphone test</text>
<text x="40" y="84" class="label">Wiring schematic — disconnect USB before changing any connections</text>
<rect x="510" y="145" width="365" height="545" rx="16" fill="#24364c"/><text x="692" y="180" text-anchor="middle" fill="white" style="font-size:23px;fill:white;font-weight:bold">ESP32-PICO board</text><text x="692" y="209" text-anchor="middle" style="font-size:17px;fill:#d3e1ef">USB connector at right in your photo</text>
<g fill="#fff" font-family="Arial" font-size="19" font-weight="bold"><text x="534" y="272">GPIO37</text><text x="534" y="352">GND</text><text x="534" y="432">5V</text><text x="756" y="272">GPIO4</text><text x="756" y="352">GPIO0</text><text x="756" y="432">3V3</text><text x="756" y="512">GND</text><text x="534" y="563">EN</text><text x="534" y="598">GPIO39</text><text x="534" y="633">Other GPIO</text></g>
<text x="534" y="668" style="font-size:15px;fill:#b7c8dc">Unlisted pins are not used here</text>
<rect x="35" y="155" width="245" height="355" rx="14" fill="#ffe5e2" stroke="#dc5148" stroke-width="3"/><text x="157" y="196" text-anchor="middle" class="head">KY-037</text><text x="157" y="223" text-anchor="middle" class="small">Power: 5 V test</text>
<g class="pin"><text x="221" y="272">AO</text><text x="221" y="352">G</text><text x="221" y="432">+</text><text x="221" y="512">DO</text></g>
<text x="52" y="484" class="small">DO: leave disconnected</text>
<rect x="1110" y="155" width="245" height="355" rx="14" fill="#e0f1ff" stroke="#3687c8" stroke-width="3"/><text x="1232" y="196" text-anchor="middle" class="head">Existing OLED</text><text x="1232" y="223" text-anchor="middle" class="small">4-pin I²C display</text><g class="pin"><text x="1124" y="272">SDA</text><text x="1124" y="352">SCL</text><text x="1124" y="432">VCC</text><text x="1124" y="512">GND</text></g>
<path class="wire" stroke="#2868c7" d="M280 265 H326"/><path class="wire" stroke="#2868c7" d="M426 265 H510"/><rect x="326" y="250" width="100" height="30" rx="6" fill="#fff" stroke="#2868c7" stroke-width="3"/><text x="376" y="271" text-anchor="middle" class="small">R1 10kΩ</text><circle cx="465" cy="265" r="7" fill="#2868c7"/>
<path class="wire" stroke="#2868c7" d="M465 265 V305"/><rect x="445" y="305" width="40" height="92" rx="6" fill="#fff" stroke="#2868c7" stroke-width="3"/><text x="493" y="350" class="small">R2 10kΩ</text><path class="wire" stroke="#292d35" d="M465 397 V405 M445 405 H485 M451 411 H479 M458 417 H472"/>
<path class="wire" stroke="#292d35" d="M280 345 H310 V370 M290 370 H330 M296 378 H324 M303 386 H317"/><path class="wire" stroke="#292d35" d="M510 345 H493 V370 M473 370 H513 M479 378 H507 M486 386 H500"/><path class="wire" stroke="#d33d37" d="M280 425 H510"/>
<path class="wire" stroke="#13876b" d="M875 265 H1110"/><path class="wire" stroke="#c17410" d="M875 345 H1110"/><path class="wire" stroke="#d33d37" d="M875 425 H1110"/><path class="wire" stroke="#292d35" d="M875 505 H1110"/>
<text x="318" y="228" class="small">AO only reaches GPIO37 through R1</text><text x="391" y="245" class="small">divider junction ●</text>
<rect x="40" y="723" width="1320" height="267" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="62" y="758" class="head">Breadboard: each numbered row has TWO separate connected groups</text>
<text x="65" y="794" class="label">a–e = connected</text><text x="355" y="794" class="label">center gap</text><text x="520" y="794" class="label">f–j = connected</text>
<g fill="#c8d6e5"><circle cx="82" cy="823" r="9"/><circle cx="125" cy="823" r="9"/><circle cx="168" cy="823" r="9"/><circle cx="211" cy="823" r="9"/><circle cx="254" cy="823" r="9"/><circle cx="540" cy="823" r="9"/><circle cx="583" cy="823" r="9"/><circle cx="626" cy="823" r="9"/><circle cx="669" cy="823" r="9"/><circle cx="712" cy="823" r="9"/></g><path d="M82 823 H254 M540 823 H712" stroke="#4d75a6" stroke-width="4"/><text x="326" y="829" class="small">NOT connected</text>
<text x="65" y="871" class="label">Choose one empty five-hole group as the junction ●. Place in it:</text><text x="65" y="899" class="label">one end of R1, one end of R2, and a wire to the GPIO37 group.</text><text x="65" y="931" class="label">Connect R1’s other end to AO; R2’s other end to the shared GND.</text><text x="65" y="963" class="label" fill="#b42318">Ground symbols all connect to ESP32 GND. Never connect AO directly to GPIO37.</text>
</svg>
