<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
 text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:bold}.sub{font-size:17px;fill:#526079}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.tiny{font-size:13px}.pin{font-size:15px;font-weight:bold}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
</style></defs>
<rect width="1400" height="900" fill="#f6f8fb"/>
<text x="55" y="55" class="title">ESP32-PICO-KIT-1 v1.0 — Guitar Tuner Wiring</text>
<text x="55" y="86" class="sub">Reference uses official J2/J3 connector pin numbers. Wokwi's generic ESP32 DevKit V1 is only a simulator stand-in.</text>
<!-- breadboard -->
<rect x="190" y="190" width="1030" height="520" rx="22" fill="#fff" stroke="#8793a5" stroke-width="3"/>
<rect x="215" y="215" width="980" height="48" rx="9" fill="#edf2f7"/><text x="230" y="246" class="small">+3V3 distribution rail</text>
<rect x="215" y="638" width="980" height="48" rx="9" fill="#edf2f7"/><text x="230" y="669" class="small">GND distribution rail</text>
<line x1="700" y1="282" x2="700" y2="620" stroke="#aab4c2" stroke-dasharray="8 8" stroke-width="3"/>
<text x="420" y="308" class="small" fill="#718096">30 numbered rows (schematic placement, not exact hole coordinates)</text>
<!-- kit -->
<rect x="510" y="355" width="300" height="200" rx="18" fill="#263348" stroke="#111827" stroke-width="3"/>
<rect x="575" y="380" width="170" height="90" rx="8" fill="#46566f"/><text x="660" y="420" text-anchor="middle" fill="white" class="label">ESP32-PICO-V3</text><text x="660" y="448" text-anchor="middle" fill="white" class="small">ESP32-PICO-KIT-1 v1.0</text>
<text x="530" y="345" class="label">J2</text><text x="775" y="345" class="label">J3</text>
<!-- J2 pins -->
<g fill="#d9dee7" stroke="#596579"><rect x="498" y="365" width="12" height="12"/><rect x="498" y="385" width="12" height="12"/><rect x="498" y="405" width="12" height="12"/><rect x="498" y="425" width="12" height="12"/><rect x="498" y="445" width="12" height="12"/><rect x="498" y="465" width="12" height="12"/><rect x="498" y="485" width="12" height="12"/><rect x="498" y="505" width="12" height="12"/><rect x="498" y="525" width="12" height="12"/><rect x="498" y="545" width="12" height="12"/></g>
<text x="445" y="376" class="tiny">J2-1 IO20</text><text x="445" y="396" class="tiny">J2-2 IO21</text><text x="445" y="416" class="tiny">J2-3 IO22</text><text x="445" y="436" class="tiny">J2-4 IO19</text><text x="445" y="456" class="tiny">J2-5 IO8</text><text x="445" y="476" class="tiny">J2-6 IO7</text><text x="445" y="496" class="tiny">J2-7 IO5</text><text x="445" y="516" class="tiny">J2-8 IO10</text><text x="445" y="536" class="tiny">J2-9 IO9</text><text x="445" y="556" class="tiny">J2-18 3V3 / J2-17 GND*</text>
<!-- J3 pins -->
<g fill="#d9dee7" stroke="#596579"><rect x="810" y="365" width="12" height="12"/><rect x="810" y="385" width="12" height="12"/><rect x="810" y="405" width="12" height="12"/><rect x="810" y="425" width="12" height="12"/><rect x="810" y="445" width="12" height="12"/><rect x="810" y="465" width="12" height="12"/><rect x="810" y="485" width="12" height="12"/><rect x="810" y="505" width="12" height="12"/><rect x="810" y="525" width="12" height="12"/></g>
<text x="832" y="376" class="tiny">J3-1 GND</text><text x="832" y="396" class="tiny" fill="#d94841">J3-2 SENSOR_VP / GPIO36 (ADC1)</text><text x="832" y="416" class="tiny">J3-3 SENSOR_VN / GPIO39</text><text x="832" y="436" class="tiny">J3-4 IO25</text><text x="832" y="456" class="tiny">J3-5 IO26</text><text x="832" y="476" class="tiny">J3-6 IO32</text><text x="832" y="496" class="tiny">J3-7 IO33</text><text x="832" y="516" class="tiny">J3-8 IO27</text><text x="832" y="536" class="tiny">J3-16 3V3 / J3-17 GND*</text>
<!-- devices -->
<rect x="255" y="100" width="275" height="125" rx="16" fill="#172033"/><rect x="278" y="118" width="230" height="85" rx="8" fill="#183c48" stroke="#3dd6b0" stroke-width="2"/><text x="393" y="150" text-anchor="middle" fill="#effff9" class="label">SSD1306 OLED</text><text x="393" y="176" text-anchor="middle" fill="#c1ece1" class="small">128 × 64 I²C display</text>
<rect x="905" y="105" width="255" height="120" rx="15" fill="#fff" stroke="#526079" stroke-width="3"/><circle cx="950" cy="165" r="24" fill="#cbd5e1" stroke="#526079" stroke-width="3"/><text x="987" y="151" class="label">Microphone preamp</text><text x="987" y="177" class="small">3.3 V, biased audio OUT</text>
<!-- wires -->
<path class="wire" stroke="#138a62" d="M510 391 C470 340 460 280 480 225"/><path class="wire" stroke="#2677cc" d="M510 411 C490 330 500 280 500 225"/><path class="wire" stroke="#de3939" d="M505 555 C400 600 320 600 320 685 L260 685 L260 240 L285 225"/><path class="wire" stroke="#222b38" d="M505 555 C450 620 400 630 400 680 L300 680"/><path class="wire" stroke="#e17b20" d="M822 391 C900 340 950 290 950 225"/><path class="wire" stroke="#de3939" d="M805 555 C900 610 1110 610 1110 680"/><path class="wire" stroke="#222b38" d="M805 375 C860 600 1070 630 1070 680"/>
<!-- key -->
<rect x="75" y="755" width="1250" height="105" rx="16" fill="#fff" stroke="#d4dbe5" stroke-width="2"/>
<text x="100" y="790" class="label">Connection key</text>
<line x1="280" y1="785" x2="340" y2="785" stroke="#138a62" stroke-width="5"/><text x="350" y="791" class="small">SDA: GPIO21 (J2-2)</text><line x1="540" y1="785" x2="600" y2="785" stroke="#2677cc" stroke-width="5"/><text x="610" y="791" class="small">SCL: GPIO22 (J2-3)</text><line x1="810" y1="785" x2="870" y2="785" stroke="#e17b20" stroke-width="5"/><text x="880" y="791" class="small">Audio OUT: GPIO36 (J3-2)</text>
<line x1="280" y1="825" x2="340" y2="825" stroke="#de3939" stroke-width="5"/><text x="350" y="831" class="small">3.3 V: J2-18 / J3-16</text><line x1="540" y1="825" x2="600" y2="825" stroke="#222b38" stroke-width="5"/><text x="610" y="831" class="small">GND: J2-17 / J3-1</text><text x="890" y="831" class="small" fill="#9d2c2c">*Use shared 3V3 and GND rails.</text>
<text x="55" y="885" class="tiny" fill="#6b7280">Important: never connect a bare microphone directly. Preamp output must be biased near 1.65 V and remain within 0–3.3 V. Image is a labeled signal map, not physical hole-by-hole placement.</text>
</svg>
